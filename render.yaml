databases:
  - name: hatton-schultz-db
    plan: free
    databaseName: hsn_db
    user: hsn_user

services:
  - type: web
    name: hatton-schultz-novias
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hatton-schultz-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        value: hattonschultz2026
