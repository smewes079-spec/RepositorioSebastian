# Nota: este archivo es solo referencia/documentación de la infraestructura.
# Cambiarlo aquí no mueve nada en el dashboard de Render por sí solo — el
# upgrade real de plan (y el pago) se hace manualmente ahí.
databases:
  - name: hatton-schultz-db
    plan: starter
    databaseName: hsn_db
    user: hsn_user

services:
  - type: web
    name: hatton-schultz-novias
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hatton-schultz-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        value: hattonschultz2026
